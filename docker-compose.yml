name: homelab-dashboard

# One small container: the Python server serves both the dashboard page (web/) and its data.
# Every setting comes from .env (copy .env.example); anything left empty is simply switched off.
services:
  dashboard:
    build: ./server-api
    image: homelab-dashboard:1.0.0
    container_name: homelab-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    pid: host         # see host processes (top programs, playit, energy tracker)
    read_only: true
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]   # read root-only files (auth.log) without being able to write anything
    security_opt: [no-new-privileges:true]
    environment:
      TZ: ${TZ:-UTC}
      MOCK: ${MOCK:-0}
      DASHBOARD_NAME: ${DASHBOARD_NAME:-homelab}
      DASHBOARD_PUBLIC_URL: ${DASHBOARD_PUBLIC_URL:-}     # where a tap on a phone alert opens
      DASHBOARD_ADMIN_PIN: ${DASHBOARD_ADMIN_PIN:-}       # unlocks Ignore/Mute; empty = read-only dashboard
      IGNORE_STOPPED_CONTAINERS: ${IGNORE_STOPPED_CONTAINERS:-}
      ENERGY_DIR: /hostfs${ENERGY_DIR:-/opt/energy-tracker}
      RATE_INR_PER_KWH: ${RATE_INR_PER_KWH:-5}
      IMMICH_URL: ${IMMICH_URL:-}
      IMMICH_API_KEY: ${IMMICH_API_KEY:-}
      DASH_GITHUB_TOKEN: ${DASH_GITHUB_TOKEN:-}
      GITHUB_ORG: ${DASH_GITHUB_ORG:-}
      GITHUB_RUNNER: ${DASH_GITHUB_RUNNER:-}
      NTFY_URL: ${NTFY_URL:-}             # phone alerts; off when URL or token is empty
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-server-alerts}
      DATA_DIR: /data                     # incidents (SQLite), the only writable place
    volumes:
      - /:/hostfs:ro,rslave
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dashboard-data:/data
    mem_limit: 64m
    logging:          # keep Docker's own log file for this container small
      driver: json-file
      options: {max-size: "1m", max-file: "3"}

volumes:
  dashboard-data:
